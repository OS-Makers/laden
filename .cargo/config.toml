[build]
target = "x86_64-unknown-uefi"

[target.x86_64-unknown-uefi]
runner = ["bash", "scripts/run_qemu.sh"]

[target.x86_64-unknown-uefi-gdb]
runner = ["bash", "scripts/run_qemu.sh"]
rustflags = ["-C", "link-arg=/debug:dwarf", "-C", "link-arg=/timestamp:1279345733"]

[alias]
debug = [
    "run", "--quiet", "--manifest-path", "tools/debug/Cargo.toml",
    "--target", "x86_64-unknown-linux-gnu",
    "--target-dir", "target/debug-command", "--",
]